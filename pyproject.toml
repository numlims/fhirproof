[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fhirproof"
dynamic = ["version"]
# version = "0.0.20"
authors = [
  { name="numlims", email="numlims@med.uni-greifswald.de"}
]
description = "fhir import check"
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
  "dbcq @ git+https://github.com/numlims/dbcq.git",
  "dip @ git+https://github.com/numlims/dip.git",
  "figs @ git+https://github.com/numlims/figs.git",  
  "traction @ git+https://github.com/numlims/traction.git",
  "tram @ git+https://github.com/numlims/tram.git",  
  "pyyaml",
  "natsort",
  "versionflag @ git+https://github.com/numlims/versionflag.git"  
]
classifiers = [
  "Programming Language :: Python :: 3"
]

[project.scripts]
fhirproof = "fhirproof:__main__"

[tool.setuptools]
packages = ["fhirproof"]